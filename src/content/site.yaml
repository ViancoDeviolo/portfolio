  method:
    - pt: Escrevo o pedido com contexto, regras e formato.
      en: I write the request with context, rules and format.
    - pt: Mando o mesmo pedido para quatro IAs.
      en: I send the same request to four AIs.
    - pt: Comparo, testo e fico com o que se sustenta.
      en: I compare, test and keep what holds up.
  comparison:
    prompt:
      pt: Revisar, como engenheiro sênior, uma função que decide sem LLM se uma alteração é compatível com um sistema legado. Apontar bugs e casos de borda, dizer se faz sentido manter a decisão fora do LLM e sugerir no máximo 3 melhorias. Em português, em até 200 palavras, em tópicos.
      en: Review, as a senior engineer, a function that decides without an LLM whether a change is compatible with a legacy system. Point out bugs and edge cases, say whether it makes sense to keep the decision outside the LLM, and suggest at most 3 improvements. In Portuguese, in up to 200 words, as bullet points.
    answers:
      - ai: Gemini
        excerpt:
          pt: Sim. Regras de negócio, limites financeiros e roteamento de sistemas exigem determinismo, auditoria, baixa latência e zero risco de alucinação. O LLM deve apenas explicar e redigir em cima do resultado já calculado.
          en: Yes. Business rules, financial limits and system routing require determinism, auditability, low latency and zero risk of hallucination. The LLM should only explain and draft on top of the result already computed.
      - ai: Copilot
        excerpt:
          pt: A regra é determinística, auditável, reproduzível e regulatória. O LLM deve explicar o resultado, não decidir compatibilidade.
          en: The rule is deterministic, auditable, reproducible and regulatory. The LLM should explain the result, not decide compatibility.
      - ai: GPT
        excerpt:
          pt: 'Atenção arquitetural: a tarefa `task_conflict` pede status final ao LLM. Mesmo com a regra no código, o agente pode contradizê-la.'
          en: 'Architectural warning: the `task_conflict` task asks the LLM for the final status. Even with the rule in code, the agent can contradict it.'
  evolution:
