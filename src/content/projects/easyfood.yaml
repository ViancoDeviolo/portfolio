order: 4
side: ia
title: { pt: EasyFood, en: EasyFood }
problem:
  pt: Uma API de delivery. O cliente faz o pedido e o dono do restaurante acompanha cada etapa até a entrega.
  en: A food delivery API. The customer places an order and the restaurant owner moves it through each step until delivery.
aiDid:
  pt: Claude gerou a maior parte do código, dos testes e dos ADRs.
  en: Claude generated most of the code, the tests and the ADRs.
iDecided:
  pt: Escolhi o Oracle no lugar do PostgreSQL, conduzi as features de cada aula e validei tudo contra um Oracle real em Docker. Os ADRs registram o monólito modular em camadas, a autenticação com JWT e as imagens processadas por uma função serverless.
  en: I picked Oracle over PostgreSQL, drove the features for each class and checked everything against a real Oracle database in Docker. The ADRs record the layered modular monolith, JWT authentication and images processed by a serverless function.
stack: [Node.js, Express, Oracle, Docker]
