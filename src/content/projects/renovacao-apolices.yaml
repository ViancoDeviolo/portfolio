order: 7
side: ia
title: { pt: Renovação de Apólices, en: Policy Renewal }
problem:
  pt: Renovar uma apólice levava horas de trabalho manual e falhava quando o sistema legado recusava a proposta. Agentes com CrewAI montam a proposta e conferem o legado antes da emissão.
  en: Renewing an insurance policy took hours of manual work and failed when the legacy system rejected the proposal. CrewAI agents build the proposal and check the legacy rules before issuing.
aiDid:
  pt: Os agentes leem o pedido do cliente e redigem a proposta de renovação.
  en: The agents read the customer request and draft the renewal proposal.
iDecided:
  pt: As regras do legado ficam em Python, fora do modelo. A verificação é determinística e escolhe a rota de emissão.
  en: The legacy rules live in Python, outside the model. The check is deterministic and picks the issuing route.
stack: [Python, CrewAI]
