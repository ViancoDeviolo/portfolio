    src: /media/renovacao-apolices/crewai-regras-legado.webp
    alt:
      pt: Verificação determinística do legado. Duas coberturas e uma franquia não são aceitas pelo legado Java, e a emissão segue pela API nova.
      en: Deterministic legacy check. Two coverages and one deductible are not accepted by the Java legacy system, so issuing goes through the newer API.
  - kind: image
    src: /media/renovacao-apolices/crewai-comparativo.webp
