order: 7
side: ia
title: { pt: Renovação de Apólices, en: Policy Renewal }
problem:
  pt: Cenário fictício do trabalho da disciplina AI Bots & Process Automation. Nele, renovar uma apólice levava horas de trabalho manual e falhava quando o sistema legado recusava a proposta. Agentes com CrewAI montam a proposta e conferem o legado antes da emissão.
  en: A fictional scenario from coursework for the AI Bots & Process Automation class. In it, renewing an insurance policy took hours of manual work and failed when the legacy system rejected the proposal. CrewAI agents build the proposal and check the legacy rules before issuing.
aiDid:
  pt: Claude ajudou a montar e depurar o notebook, incluindo a troca de provedor de LLM e de versões.
  en: Claude helped build and debug the notebook, including switching LLM providers and versions.
iDecided:
  pt: Modelei o AS-IS e o TO-BE, defini os agentes e validei as respostas também no ChatGPT. As regras do legado ficam em Python, numa verificação determinística que escolhe a rota de emissão.
  en: I modeled the AS-IS and TO-BE, defined the agents and also checked the answers in ChatGPT. The legacy rules live in Python, in a deterministic check that picks the issuing route.
stack: [Python, CrewAI]
