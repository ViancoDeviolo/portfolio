title: { pt: Calculadoras em Java e Python, en: Java and Python calculators }
problem:
  pt: A mesma divisão dá 0,63 em Java e 0,62 em Python. A diferença está no arredondamento.
  en: The same division gives 0.63 in Java and 0.62 in Python. The gap comes from rounding.
proves:
  pt: Arredondamento muda o resultado de uma conta. Por isso dinheiro pede BigDecimal em Java e Decimal em Python.
  en: Rounding changes the result of a calculation. That is why money calls for BigDecimal in Java and Decimal in Python.
