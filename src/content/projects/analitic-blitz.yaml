order: 5
side: ia
title: { pt: Analitic Blitz, en: Analitic Blitz }
problem:
  pt: Um robô que testa estratégias de trading em cripto contra o acaso. No modo ao vivo, ele só acompanha o mercado e não envia ordens.
  en: A bot that tests crypto trading strategies against chance. In live mode it only watches the market and sends no orders.
aiDid:
  pt: Claude escreveu a maior parte do código e dos testes.
  en: Claude wrote most of the code and the tests.
iDecided:
  pt: Traduzi meu material de estudo (Wyckoff, Dow) em regras, escolhi Python e defini o critério de aprovação antes de cada teste. Em 300 operações de 2021 a 2025, a estratégia não ficou acima de 200 sorteios aleatórios e foi reprovada.
  en: I turned my study material (Wyckoff, Dow) into rules, chose Python and set the pass criterion before each test. Over 300 trades from 2021 to 2025, the strategy did not beat 200 random draws, so it failed.
stack: [Python, pytest]
