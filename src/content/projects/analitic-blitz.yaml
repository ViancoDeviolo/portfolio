order: 5
side: ia
title: { pt: Analitic Blitz, en: Analitic Blitz }
problem:
  pt: Um robô que testa estratégias de trading em cripto contra o acaso antes de qualquer uso. Ele não envia ordens.
  en: A bot that tests crypto trading strategies against chance before any use. It never sends orders.
aiDid:
  pt: Escreveu boa parte do código e dos testes do backtest a partir das minhas especificações.
  en: Wrote much of the backtest code and tests from my specifications.
iDecided:
  pt: Defini o critério de aprovação antes de rodar o teste e aceitei o resultado. Em 300 operações de 2021 a 2025, a estratégia não ficou acima de 200 sorteios aleatórios e foi reprovada.
  en: I set the pass criterion before running the test and accepted the result. Over 300 trades from 2021 to 2025, the strategy did not beat 200 random draws, so it failed.
stack: [Python, pytest]
